<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/><stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/><stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/><stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bg)"/>

  <text x="400" y="35" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="bold">🔗 Cross-Repository Data Flow</text>
  <line x1="100" y1="48" x2="700" y2="48" stroke="#334155" stroke-width="1"/>

  <!-- Left: Hypotheses repo -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="180" height="120" rx="12" fill="#1a1a2e" stroke="#00d4aa" stroke-width="2"/>
    <text x="120" y="108" text-anchor="middle" fill="#00d4aa" font-family="Arial,sans-serif" font-size="14" font-weight="bold">🧪 agent-hypotheses</text>
    <line x1="50" y1="120" x2="190" y2="120" stroke="#00d4aa" stroke-width="0.5" opacity="0.5"/>
    <text x="120" y="140" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">📄 hypotheses.json</text>
    <text x="120" y="156" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">📊 Evaluation metrics</text>
    <text x="120" y="172" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">📚 References</text>
    <text x="120" y="188" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">🎯 Expected outcomes</text>
  </g>

  <!-- Middle: Demos repo -->
  <g filter="url(#shadow)">
    <rect x="310" y="80" width="180" height="120" rx="12" fill="#1a1a2e" stroke="#7C3AED" stroke-width="2"/>
    <text x="400" y="108" text-anchor="middle" fill="#7C3AED" font-family="Arial,sans-serif" font-size="14" font-weight="bold">🐍 pennylane-demos</text>
    <line x1="330" y1="120" x2="480" y2="120" stroke="#7C3AED" stroke-width="0.5" opacity="0.5"/>
    <text x="400" y="140" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">🐍 H1-H5 Python scripts</text>
    <text x="400" y="156" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">⚙️ CLI argument parsing</text>
    <text x="400" y="172" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">📊 Timestamped results</text>
    <text x="400" y="188" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">🔗 PennyLane baselines</text>
  </g>

  <!-- Right: Experiments repo -->
  <g filter="url(#shadow)">
    <rect x="590" y="80" width="180" height="120" rx="12" fill="#1a1a2e" stroke="#10B981" stroke-width="2"/>
    <text x="680" y="108" text-anchor="middle" fill="#10B981" font-family="Arial,sans-serif" font-size="14" font-weight="bold">📓 agent-experiments</text>
    <line x1="610" y1="120" x2="760" y2="120" stroke="#10B981" stroke-width="0.5" opacity="0.5"/>
    <text x="680" y="140" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">📓 Jupyter notebooks</text>
    <text x="680" y="156" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">⚙️ YAML configurations</text>
    <text x="680" y="172" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">✅ CI smoke tests</text>
    <text x="680" y="188" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">🤖 GitHub Actions</text>
  </g>

  <!-- Arrows -->
  <line x1="210" y1="140" x2="306" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="258" y="132" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">defines</text>

  <line x1="490" y1="140" x2="586" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="538" y="132" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">packages</text>

  <!-- Return arrow (validation) -->
  <path d="M680,200 L680,250 L120,250 L120,204" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowb)"/>
  <text x="400" y="263" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">results validate hypotheses</text>

  <!-- Bottom: Data format examples -->
  <line x1="50" y1="280" x2="750" y2="280" stroke="#334155" stroke-width="1"/>

  <text x="400" y="305" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Data Flow Example: Hypothesis → Code → Results</text>

  <!-- Hypothesis JSON example -->
  <rect x="40" y="320" width="220" height="60" rx="6" fill="#1e293b"/>
  <text x="50" y="338" fill="#8B5CF6" font-family="monospace" font-size="8">hypotheses.json</text>
  <text x="50" y="352" fill="#cbd5e1" font-family="monospace" font-size="7">{ "id": "H1", "rank": 1,</text>
  <text x="50" y="364" fill="#cbd5e1" font-family="monospace" font-size="7">  "title": "Joint NAS...",</text>
  <text x="50" y="376" fill="#cbd5e1" font-family="monospace" font-size="7">  "estimate_cost": "medium" }</text>

  <text x="280" y="350" fill="#475569" font-family="Arial,sans-serif" font-size="16">→</text>

  <!-- Python script -->
  <rect x="310" y="320" width="220" height="60" rx="6" fill="#1e293b"/>
  <text x="320" y="338" fill="#10B981" font-family="monospace" font-size="8">h1_joint_nas_hqnn.py</text>
  <text x="320" y="352" fill="#cbd5e1" font-family="monospace" font-size="7">$ python h1_joint_nas_hqnn.py</text>
  <text x="320" y="364" fill="#cbd5e1" font-family="monospace" font-size="7">nq=4 L=2 ent=linear acc=0.85</text>
  <text x="320" y="376" fill="#cbd5e1" font-family="monospace" font-size="7">nq=6 L=3 ent=circular acc=0.91</text>

  <text x="550" y="350" fill="#475569" font-family="Arial,sans-serif" font-size="16">→</text>

  <!-- Results JSON -->
  <rect x="580" y="320" width="180" height="60" rx="6" fill="#1e293b"/>
  <text x="590" y="338" fill="#F59E0B" font-family="monospace" font-size="8">results/h1_results.json</text>
  <text x="590" y="352" fill="#cbd5e1" font-family="monospace" font-size="7">{ "pareto_front": [...],</text>
  <text x="590" y="364" fill="#cbd5e1" font-family="monospace" font-size="7">  "n_architectures": 48,</text>
  <text x="590" y="376" fill="#cbd5e1" font-family="monospace" font-size="7">  "n_pareto_optimal": 7 }</text>
</svg>
